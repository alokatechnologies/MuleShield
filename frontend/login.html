<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — MULE SHIELD Financial Intelligence Platform</title>
  <meta name="description" content="Secure authentication gate for MULE SHIELD Multi-Agent Financial Intelligence and Forensic Surveillance.">
  <meta name="theme-color" content="#0E0B1D">

  <!-- Favicons and App Manifest -->
  <link rel="icon" type="image/svg+xml" href="assets/mule-shield-logo.svg">
  <link rel="alternate icon" type="image/png" href="assets/mule-shield-logo.png">
  <link rel="apple-touch-icon" href="assets/mule-shield-logo.png">
  <link rel="manifest" href="manifest.json">

  <!-- Fonts & Core Stylesheet -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="frontend/css/styles.css">
</head>
<body class="login-page-body">

  <div class="login-stage">
    
    <!-- Central Luxury Login Plinth -->
    <main class="login-card" role="main">
      
      <!-- Card Header: Clean Logo & MULE SHIELD Title Only -->
      <div class="login-header">
        <div class="login-logo-direct" title="MULE SHIELD AML Intelligence Engine">
          <img src="assets/mule-shield-logo.svg" onerror="this.onerror=null;this.src='assets/mule-shield-logo.png';" alt="MULE SHIELD Logo" class="mule-shield-logo-img mule-shield-logo--loading" />
        </div>
        <h1 class="login-app-title">MULE SHIELD</h1>
      </div>

      <!-- Real-time Alert / Validation Banner -->
      <div id="login-alert" class="login-alert" style="display: none;" role="alert" aria-live="polite">
        <svg class="login-alert-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span id="login-alert-text" class="login-alert-text"></span>
      </div>

      <!-- Authenticated Login Form -->
      <form id="login-form" class="login-form" novalidate autocomplete="on">
        
        <!-- Identifier Input -->
        <div class="form-group">
          <label for="login-identifier" class="form-label">Email or Username</label>
          <div class="input-with-icon">
            <svg class="input-leading-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <input 
              type="text" 
              id="login-identifier" 
              name="username" 
              class="input-text login-input" 
              placeholder="Enter email or username" 
              required 
              autocomplete="username" 
              spellcheck="false"
            />
          </div>
        </div>

        <!-- Password Input with Interactive Visibility Toggle -->
        <div class="form-group">
          <div class="form-label-row">
            <label for="login-password" class="form-label">Password</label>
            <a href="javascript:void(0)" id="link-forgot-password" class="login-link-muted" tabindex="0">Forgot password?</a>
          </div>
          <div class="input-with-icon">
            <svg class="input-leading-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input 
              type="password" 
              id="login-password" 
              name="password" 
              class="input-text login-input password-input" 
              placeholder="Enter password" 
              required 
              autocomplete="current-password"
            />
            <button 
              type="button" 
              id="btn-toggle-password" 
              class="password-toggle-btn" 
              aria-label="Toggle password visibility" 
              title="Show / Hide Password"
            >
              <!-- Eye open icon (default) -->
              <svg id="eye-icon-show" class="toggle-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <!-- Eye off icon (hidden initially) -->
              <svg id="eye-icon-hide" class="toggle-icon-svg" style="display:none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
                <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
                <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
                <line x1="2" y1="2" x2="22" y2="22"></line>
              </svg>
            </button>
          </div>
        </div>

        <!-- Remember Me Option -->
        <div class="login-options-row">
          <label class="login-checkbox-label">
            <input type="checkbox" id="login-remember" class="input-checkbox" checked />
            <span>Remember Me</span>
          </label>
        </div>

        <!-- Primary Sign In Button -->
        <button type="submit" id="btn-login-submit" class="btn btn-primary btn-login-submit">
          <span class="btn-text">Sign In</span>
          <span class="btn-loader" style="display:none;">
            <svg class="spinner-svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5">
              <circle cx="12" cy="12" r="10" stroke-opacity="0.25"></circle>
              <path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round"></path>
            </svg>
            <span>Signing In...</span>
          </span>
        </button>

        <!-- Switch to Register -->
        <div class="login-auth-switch">
          <span>New User?</span>
          <a href="register.html" id="link-create-account">Create Account</a>
        </div>

      </form>
    </main>

    <!-- Minimal Aloka Brand Signature: Only Aloka Logo + Powered by Aloka -->
    <footer class="aloka-minimal-signature login-signature" aria-label="Aloka Brand Signature">
      <img src="assets/aloka-logo.png" alt="Aloka Logo" class="aloka-minimal-logo" width="20" height="17" loading="lazy" />
      <span class="aloka-minimal-text">Powered by Aloka</span>
    </footer>

  </div>

  <!-- Client-side Interactive Authentication Controller -->
  <script src="frontend/js/login.js"></script>
</body>
</html>
