<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — MULE SHIELD Financial Intelligence Platform</title>
  <meta name="description" content="Authorized investigator onboarding for MULE SHIELD Multi-Agent Financial Intelligence and Forensic Surveillance.">
  <meta name="theme-color" content="#0E0B1D">

  <!-- Favicons and App Manifest -->
  <link rel="icon" type="image/svg+xml" href="assets/mule-shield-logo.svg">
  <link rel="alternate icon" type="image/png" href="assets/mule-shield-logo.png">
  <link rel="apple-touch-icon" href="assets/mule-shield-logo.png">
  <link rel="manifest" href="manifest.json">

  <!-- Fonts & Core Stylesheet -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="frontend/css/styles.css">
</head>
<body class="login-page-body">

  <div class="login-stage register-stage">
    
    <!-- Central Luxury Register Plinth -->
    <main class="login-card register-card" role="main" style="max-width: 440px;">
      
      <!-- Card Header: Clean Logo & MULE SHIELD Title -->
      <div class="login-header">
        <div class="login-logo-direct" title="MULE SHIELD AML Intelligence Engine">
          <img src="assets/mule-shield-logo.svg" onerror="this.onerror=null;this.src='assets/mule-shield-logo.png';" alt="MULE SHIELD Logo" class="mule-shield-logo-img mule-shield-logo--loading" />
        </div>
        <h1 class="login-app-title">MULE SHIELD</h1>
        <p class="login-welcome-msg" style="margin-top: 6px; font-size: 12.5px;">Create an authorized investigator account</p>
      </div>

      <!-- Real-time Alert / Validation Banner -->
      <div id="register-alert" class="login-alert" style="display: none;" role="alert" aria-live="polite">
        <svg class="login-alert-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span id="register-alert-text" class="login-alert-text"></span>
      </div>

      <!-- Registration Form -->
      <form id="register-form" class="login-form" novalidate autocomplete="off">
        
        <!-- Full Name Input -->
        <div class="form-group">
          <label for="reg-fullname" class="form-label">Full Name</label>
          <div class="input-with-icon">
            <svg class="input-leading-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <input 
              type="text" 
              id="reg-fullname" 
              name="full_name" 
              class="input-text login-input" 
              placeholder="e.g. Agent Elena Rostova" 
              required 
              autocomplete="name"
            />
          </div>
        </div>

        <!-- Institutional Email Input -->
        <div class="form-group">
          <label for="reg-email" class="form-label">Institutional Email</label>
          <div class="input-with-icon">
            <svg class="input-leading-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect width="20" height="16" x="2" y="4" rx="2"></rect>
              <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
            </svg>
            <input 
              type="email" 
              id="reg-email" 
              name="email" 
              class="input-text login-input" 
              placeholder="investigator@agency.gov" 
              required 
              autocomplete="email"
              spellcheck="false"
            />
          </div>
        </div>

        <!-- Username Input -->
        <div class="form-group">
          <label for="reg-username" class="form-label">Investigator Username</label>
          <div class="input-with-icon">
            <svg class="input-leading-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <line x1="19" y1="8" x2="19" y2="14"></line>
              <line x1="22" y1="11" x2="16" y2="11"></line>
            </svg>
            <input 
              type="text" 
              id="reg-username" 
              name="username" 
              class="input-text login-input" 
              placeholder="e.g. agent.rostova" 
              required 
              autocomplete="username" 
              spellcheck="false"
            />
          </div>
        </div>

        <!-- Password Input with Interactive Visibility Toggle -->
        <div class="form-group">
          <label for="reg-password" class="form-label">Security Password</label>
          <div class="input-with-icon">
            <svg class="input-leading-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input 
              type="password" 
              id="reg-password" 
              name="password" 
              class="input-text login-input password-input" 
              placeholder="Minimum 6 characters" 
              required 
              autocomplete="new-password"
            />
            <button 
              type="button" 
              id="btn-toggle-reg-password" 
              class="password-toggle-btn" 
              aria-label="Toggle password visibility" 
              title="Show / Hide Password"
            >
              <svg id="eye-icon-reg-show" class="toggle-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg id="eye-icon-reg-hide" class="toggle-icon-svg" style="display:none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
                <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
                <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
                <line x1="2" y1="2" x2="22" y2="22"></line>
              </svg>
            </button>
          </div>
        </div>

        <!-- Confirm Password Input -->
        <div class="form-group">
          <label for="reg-confirm-password" class="form-label">Confirm Password</label>
          <div class="input-with-icon">
            <svg class="input-leading-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            </svg>
            <input 
              type="password" 
              id="reg-confirm-password" 
              name="confirm_password" 
              class="input-text login-input password-input" 
              placeholder="Re-enter your password" 
              required 
              autocomplete="new-password"
            />
            <button 
              type="button" 
              id="btn-toggle-reg-confirm" 
              class="password-toggle-btn" 
              aria-label="Toggle confirm password visibility" 
              title="Show / Hide Password"
            >
              <svg id="eye-icon-confirm-show" class="toggle-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg id="eye-icon-confirm-hide" class="toggle-icon-svg" style="display:none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
                <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
                <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
                <line x1="2" y1="2" x2="22" y2="22"></line>
              </svg>
            </button>
          </div>
        </div>

        <!-- Primary Create Account Button -->
        <button type="submit" id="btn-register-submit" class="btn btn-primary btn-login-submit" style="margin-top: 10px;">
          <span class="btn-text">Create Account</span>
          <span class="btn-loader" style="display:none;">
            <svg class="spinner-svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5">
              <circle cx="12" cy="12" r="10" stroke-opacity="0.25"></circle>
              <path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round"></path>
            </svg>
            <span>Creating Account...</span>
          </span>
        </button>

        <!-- Back to Sign In Link -->
        <div class="login-auth-switch">
          <span>Already have an authorized account?</span>
          <a href="login.html" id="link-back-login">Sign In</a>
        </div>

      </form>
    </main>

    <!-- Minimal Aloka Brand Signature: Only Aloka Logo + Powered by Aloka -->
    <footer class="aloka-minimal-signature login-signature" aria-label="Aloka Brand Signature">
      <img src="assets/aloka-logo.png" alt="Aloka Logo" class="aloka-minimal-logo" width="20" height="17" loading="lazy" />
      <span class="aloka-minimal-text">Powered by Aloka</span>
    </footer>

  </div>

  <!-- Client-side Interactive Registration Controller -->
  <script src="frontend/js/register.js"></script>
</body>
</html>
